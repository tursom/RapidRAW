[package]
name = "rapidraw-intake-spike"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:webview2-com", "dep:windows"]

[[bin]]
name = "rapidraw-intake-spike"
required-features = ["desktop"]

[dependencies]
clipboard-rs = "=0.3.5"
serde_json = "1"
sha2 = "=0.10.9"
tauri = { version = "=2.12.1", optional = true }

[target.'cfg(windows)'.dependencies]
clipboard-win = "=5.4.3"
webview2-com = { version = "=0.39.1", optional = true }
windows = { version = "=0.62.2", optional = true }

[build-dependencies]
tauri-build = { version = "=2.7.1", optional = true }
