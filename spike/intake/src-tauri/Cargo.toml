[package]
name = "rapidraw-intake-spike"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["desktop", "original-images"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:webview2-com", "dep:windows", "dep:block2", "dep:objc2-web-kit", "objc2/exception"]
original-images = ["dep:reqwest"]

[[bin]]
name = "rapidraw-intake-spike"
required-features = ["desktop"]

[dependencies]
clipboard-rs = "=0.3.5"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
reqwest = { version = "=0.13.4", optional = true, default-features = false, features = ["blocking", "rustls"] }
serde_json = "1"
sha2 = "=0.10.9"
tauri = { version = "=2.12.1", optional = true }

[target.'cfg(windows)'.dependencies]
clipboard-win = "=5.4.3"
webview2-com = { version = "=0.39.1", optional = true }
windows = { version = "=0.62.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "=0.6.2", optional = true }
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSDragging", "NSEvent", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-web-kit = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "WKWebView", "block2", "objc2-app-kit"] }

[build-dependencies]
tauri-build = { version = "=2.7.1", optional = true }
