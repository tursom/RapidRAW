[package]
name = "rapidraw-intake-spike"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[[bin]]
name = "rapidraw-intake-spike"
required-features = ["desktop"]

[dependencies]
clipboard-rs = "=0.3.5"
serde_json = "1"
tauri = { version = "=2.12.1", optional = true }

[build-dependencies]
tauri-build = { version = "=2.7.1", optional = true }
